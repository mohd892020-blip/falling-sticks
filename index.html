<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070b16">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stickbolt">
<meta name="description" content="Stickbolt: a fast arcade reflex game. Catch the stick that matches the glowing arch before it hits the floor.">
<title>Stickbolt</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* ================= DESIGN SYSTEM ================= */
:root{
  --c-bg:#070b16;--c-bg-2:#0c1430;
  --c-surface:#121a33;--c-surface-2:#1a2547;--c-surface-3:#26346a;
  --c-line:rgba(255,255,255,.12);--c-line-2:rgba(255,255,255,.24);
  --c-text:#eef4ff;--c-muted:#a3b3d6;--c-dim:#64748b;
  --c-accent:#fbbf24;--c-accent-l:#fde047;--c-accent-d:#a14a06;--c-on-accent:#3a1d00;
  --c-pink:#ff3ea5;--c-cyan:#22d3ee;--c-violet:#a78bfa;
  --c-blue:#3b82f6;--c-green:#22c55e;--c-red:#ef4444;--c-gold:#facc15;
  --c-good:#4ade80;--c-bad:#f87171;
  --c-scrim:rgba(4,7,16,.74);--c-glass:rgba(10,15,32,.8);
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;
  --r-1:10px;--r-2:16px;--r-3:22px;--r-pill:999px;
  --f-disp:Lalezar,Cairo,"Segoe UI",Tahoma,system-ui,sans-serif;
  --f-body:Cairo,"Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --target:#3b82f6;--dur:.28s;
  /* surfaces used by cards, lists, screens (themes override these) */
  --card-a:rgba(28,40,78,.94);--card-b:rgba(14,20,42,.94);--panel:rgba(18,26,51,.92);--panel-2:#1a2547;
  --screen-a:rgba(23,48,90,.9);--screen-b:rgba(7,11,22,.96);--shade:5,8,18;--top-bg:rgba(7,11,22,.97);
  --well:rgba(0,0,0,.35);--track:#334155;--input-bg:#060a18;--input-fg:#cfe0ff;--btn-bd:#070b18;
  --pri-1:#fde047;--pri-2:#f59e0b;--pri-bd:#a14a06;--heart-off:#2a3045;--cheer:#fde68a;--star-off:#273152;
  --logo:#ffffff;--logo-g1:#38bdf8;--logo-g2:#2563eb;--logo-d:#1d4ed8;--toast-a:#2a3a78;--toast-b:#16204a;
  color-scheme:dark;font-size:16px;
}
/* ---------- themes (html[data-theme]) ---------- */
html[data-theme=sunset]{--c-bg:#1a0b26;--c-surface:#2a1238;--c-surface-2:#3a1a4a;--c-surface-3:#5a2a5e;--c-line:rgba(255,220,200,.14);--c-line-2:rgba(255,220,200,.26);--c-text:#fff4ec;--c-muted:#e7bfc6;--c-dim:#a8829a;
  --c-accent:#ff9f43;--c-accent-l:#ffd166;--c-accent-d:#b4471c;--c-on-accent:#3a1300;--c-glass:rgba(42,14,50,.8);--c-scrim:rgba(26,8,30,.72);
  --card-a:rgba(78,32,86,.95);--card-b:rgba(42,15,52,.95);--panel:rgba(58,22,66,.92);--panel-2:#5a2a5e;--screen-a:rgba(255,120,90,.55);--screen-b:rgba(30,10,40,.95);--shade:30,10,40;--top-bg:rgba(30,10,40,.96);
  --track:#6b3a5e;--input-bg:#1f0a26;--input-fg:#ffe3d6;--btn-bd:#14061c;--pri-1:#ffd166;--pri-2:#ff8a3d;--pri-bd:#a33a12;--heart-off:#5a2a4e;--cheer:#ffd3a8;--star-off:#5a2a4e;
  --logo:#fff7ed;--logo-g1:#ff9f43;--logo-g2:#ff3ea5;--logo-d:#b4235a;--toast-a:#6b2a6a;--toast-b:#3a1240}
html[data-theme=day]{--c-bg:#e8f4ff;--c-surface:#ffffff;--c-surface-2:#eef4fb;--c-surface-3:#dbe8f7;--c-line:rgba(15,40,80,.14);--c-line-2:rgba(15,40,80,.26);--c-text:#10213a;--c-muted:#4a5f7d;--c-dim:#6b7c96;
  --c-accent:#f59e0b;--c-accent-l:#e07b00;--c-accent-d:#b45309;--c-on-accent:#3a1d00;--c-glass:rgba(255,255,255,.88);--c-scrim:rgba(200,222,245,.7);
  --card-a:rgba(255,255,255,.97);--card-b:rgba(240,246,253,.97);--panel:rgba(255,255,255,.96);--panel-2:#e6eef8;--screen-a:rgba(170,215,255,.85);--screen-b:rgba(235,244,255,.97);--shade:225,238,252;--top-bg:rgba(235,244,255,.97);
  --well:rgba(15,40,80,.08);--track:#c3d0e0;--input-bg:#f7fbff;--input-fg:#10213a;--btn-bd:#9fb3cc;--heart-off:#c3cede;--cheer:#b45309;--star-off:#cbd5e1;
  --logo:#1e40af;--logo-g1:#ffffff;--logo-g2:#93c5fd;--logo-d:#0b2a6b;--toast-a:#ffffff;--toast-b:#eaf2fb;color-scheme:light}
html[data-theme=retro]{--c-bg:#1b1036;--c-surface:#24164a;--c-surface-2:#2e1d5c;--c-surface-3:#3d2878;--c-line:rgba(255,200,120,.16);--c-line-2:rgba(255,200,120,.3);--c-text:#fff3d6;--c-muted:#cbb8ea;--c-dim:#8d7bb0;
  --c-accent:#ff7b00;--c-accent-l:#ffb347;--c-accent-d:#9a3b00;--c-on-accent:#2a1000;--c-glass:rgba(30,16,60,.82);--c-scrim:rgba(20,10,40,.74);
  --card-a:rgba(52,32,104,.95);--card-b:rgba(30,18,64,.95);--panel:rgba(40,24,80,.92);--panel-2:#3d2878;--screen-a:rgba(0,190,200,.35);--screen-b:rgba(27,16,54,.96);--shade:27,16,54;--top-bg:rgba(27,16,54,.97);
  --track:#4b3a7a;--input-bg:#140b2a;--input-fg:#ffe7c2;--btn-bd:#0e0720;--pri-1:#ffb347;--pri-2:#ff6a00;--pri-bd:#8a3300;--heart-off:#3d2878;--cheer:#ffe14d;--star-off:#3d2878;
  --logo:#ffe14d;--logo-g1:#ff2bd6;--logo-g2:#7c2cff;--logo-d:#c0189c;--toast-a:#3d2878;--toast-b:#24164a}
html[data-theme=ocean]{--c-bg:#031a24;--c-surface:#06283a;--c-surface-2:#0a3550;--c-surface-3:#0f4a6b;--c-line:rgba(160,240,255,.14);--c-line-2:rgba(160,240,255,.28);--c-text:#e6fbff;--c-muted:#9fd3e0;--c-dim:#5f9aab;
  --c-accent:#2dd4bf;--c-accent-l:#5eead4;--c-accent-d:#0f766e;--c-on-accent:#022c26;--c-glass:rgba(4,30,44,.82);--c-scrim:rgba(2,20,28,.74);
  --card-a:rgba(10,60,84,.95);--card-b:rgba(4,34,50,.95);--panel:rgba(8,44,64,.92);--panel-2:#0f4a6b;--screen-a:rgba(20,120,160,.75);--screen-b:rgba(3,26,36,.96);--shade:3,26,36;--top-bg:rgba(3,26,36,.97);
  --track:#1e5a70;--input-bg:#021219;--input-fg:#ccf7ff;--btn-bd:#011018;--pri-1:#5eead4;--pri-2:#14b8a6;--pri-bd:#0f766e;--heart-off:#14506a;--cheer:#99f6e4;--star-off:#14506a;
  --logo:#ffffff;--logo-g1:#5eead4;--logo-g2:#0891b2;--logo-d:#0e7490;--toast-a:#0f4a6b;--toast-b:#06283a}
html[data-theme=contrast]{--c-bg:#000;--c-surface:#000;--c-surface-2:#111;--c-surface-3:#222;--c-line:#ffffff;--c-line-2:#ffffff;--c-text:#ffffff;--c-muted:#eeeeee;--c-dim:#cccccc;
  --c-accent:#ffd400;--c-accent-l:#ffe94d;--c-accent-d:#ffd400;--c-on-accent:#000;--c-glass:rgba(0,0,0,.94);--c-scrim:rgba(0,0,0,.85);
  --card-a:#000;--card-b:#000;--panel:#000;--panel-2:#1a1a1a;--screen-a:#000;--screen-b:#000;--shade:0,0,0;--top-bg:#000;
  --well:#1a1a1a;--track:#555;--input-bg:#000;--input-fg:#fff;--btn-bd:#ffd400;--pri-1:#ffd400;--pri-2:#ffd400;--pri-bd:#ffffff;--heart-off:#444;--cheer:#ffe94d;--star-off:#444;
  --logo:#ffffff;--logo-g1:#000;--logo-g2:#000;--logo-d:#ffd400;--toast-a:#000;--toast-b:#000}
html[data-theme=contrast] .card,html[data-theme=contrast] .ach,html[data-theme=contrast] .tile,html[data-theme=contrast] .lbrow,html[data-theme=contrast] .btn,html[data-theme=contrast] .pill{border:2px solid #fff}
html.big{font-size:18.5px}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--c-bg);color:var(--c-text);font-family:var(--f-body);font-weight:600;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
svg{display:block}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#probe{position:fixed;visibility:hidden;pointer-events:none;padding:var(--safe-t) 0 var(--safe-b)}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.flip{display:inline-block}
[dir=rtl] .flip{transform:scaleX(-1)}

/* ---------- buttons ---------- */
.btn{--b1:var(--c-surface-3);--b2:var(--c-surface-2);--bd:var(--btn-bd);--fg:var(--c-text);
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:52px;padding:10px 22px;border:0;border-radius:var(--r-2);
  background:linear-gradient(var(--b1),var(--b2));color:var(--fg);font-family:var(--f-disp);font-weight:400;font-size:1.25rem;line-height:1.1;cursor:pointer;
  box-shadow:0 6px 0 var(--bd),0 10px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .08s,box-shadow .08s,opacity .25s,filter .25s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--bd),0 3px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.22)}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible,.sw:focus-visible,.lv:focus-visible,.hbtn:focus-visible{outline:3px solid var(--c-cyan);outline-offset:3px}
.btn.pri{--b1:var(--pri-1);--b2:var(--pri-2);--bd:var(--pri-bd);--fg:var(--c-on-accent)}
.btn.pink{--b1:#ff7cc4;--b2:#e11d74;--bd:#7a0d3d;--fg:#fff}
.btn.cyan{--b1:#67e8f9;--b2:#0891b2;--bd:#0b4a5c;--fg:#04222b}
.btn.hsb{--b1:#f472b6;--b2:#7c3aed;--bd:#3b0764;--fg:#fff;flex-direction:column;gap:1px;line-height:1.15}
.btn.hsb small{font-family:var(--f-body);font-size:.78rem;font-weight:700;opacity:.95}
.motion .btn.hsb:not(.locked){animation:hsPulse 1.8s ease-in-out infinite}
@keyframes hsPulse{0%,100%{box-shadow:0 0 0 0 rgba(236,72,153,.55)}55%{box-shadow:0 0 0 10px rgba(236,72,153,0)}}
.btn.danger{--b1:#f87171;--b2:#dc2626;--bd:#7f1d1d;--fg:#fff}
.btn.sm{min-height:40px;font-size:1.02rem;padding:8px 14px;border-radius:var(--r-1);box-shadow:0 4px 0 var(--bd),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.sm:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bd)}
.btn.lg{min-height:66px;font-size:1.7rem;border-radius:var(--r-3)}
.btn.block{width:100%}
.btn.ico{width:46px;min-width:46px;height:46px;min-height:46px;padding:0;border-radius:14px;font-size:1.3rem}
.btn.ico svg{width:24px;height:24px;fill:currentColor}
.btn.locked,.btn:disabled{opacity:.35;pointer-events:none;filter:grayscale(.5)}
.btn .badge.new{min-width:0;padding:0 6px;background:var(--c-good,#16a34a);font-size:.62rem;letter-spacing:.04em}
.btn .badge{position:absolute;top:-6px;inset-inline-end:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--c-red);color:#fff;font-family:var(--f-body);font-size:.72rem;font-weight:800;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px var(--c-bg)}
.btn small{font-family:var(--f-body);font-weight:800;font-size:.72rem;opacity:.8;display:block}
.btn .stack{display:flex;flex-direction:column;align-items:center;gap:2px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0 0 auto 0;z-index:5;pointer-events:none;padding:calc(var(--safe-t) + 12px) calc(var(--safe-r) + 10px) 0 calc(var(--safe-l) + 10px);opacity:0;visibility:hidden;transition:opacity var(--dur),visibility var(--dur)}
#hud.on{opacity:1;visibility:visible}
#pbar{position:fixed;top:var(--safe-t);left:0;right:0;height:6px;background:rgba(255,255,255,.1)}
#pfill{display:block;height:100%;width:0;background:var(--target);box-shadow:0 0 12px var(--target);border-start-end-radius:3px;border-end-end-radius:3px;transition:width .25s,background .3s}
#pbar.boss{height:8px;background:rgba(239,68,68,.18)}
.hrow{display:flex;align-items:center;gap:var(--sp-2)}
/* pause/mute sit on the physical right; left-hand mode moves them left (same in RTL and LTR) */
html[dir=ltr] .hrow,html.lefty[dir=rtl] .hrow{flex-direction:row-reverse}
html.lefty[dir=ltr] .hrow{flex-direction:row}
.hbtn{pointer-events:auto;width:44px;height:44px;flex:none;border-radius:14px;background:var(--c-glass);border:1px solid var(--c-line);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.5);padding:0}
.hbtn svg{width:22px;height:22px;fill:currentColor}
.hbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
.hmid{flex:1;min-width:0;text-align:center;line-height:1.05;background:var(--c-glass);border:1px solid var(--c-line);border-radius:14px;padding:3px 8px}
#hLevel{font-size:.78rem;font-weight:800;color:var(--c-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hScore{font-family:var(--f-disp);font-size:1.8rem;text-shadow:0 2px 0 rgba(0,0,0,.6)}
#hLives{display:flex;gap:5px;align-items:center;background:var(--c-glass);border:1px solid var(--c-line);padding:7px 9px;border-radius:14px;flex:none;min-height:44px}
#hLives .life{display:block;position:relative;width:9px;height:25px;border-radius:5px;background:linear-gradient(90deg,#fecdd3 0,#fb7185 30%,#e11d48 70%,#9f1239 100%);box-shadow:0 0 7px rgba(244,63,94,.7),inset 0 0 0 1.2px rgba(255,228,230,.55);transition:transform .2s;background:linear-gradient(90deg,color-mix(in srgb,var(--target) 30%,#fff) 0,color-mix(in srgb,var(--target) 70%,#fff) 30%,var(--target) 70%,color-mix(in srgb,var(--target) 60%,#000) 100%);box-shadow:0 0 7px color-mix(in srgb,var(--target) 70%,transparent),inset 0 0 0 1.2px rgba(255,255,255,.5)}
#hLives .life::after{content:'';position:absolute;left:2px;top:3px;width:2.5px;height:8px;border-radius:2px;background:rgba(255,255,255,.8)}
#hLives .life.off{background:var(--heart-off);box-shadow:inset 0 0 0 1.2px rgba(148,163,184,.35)}
#hLives .life.off::after{display:none}
#hLives .life.brk{animation:lifeBrk .55s ease-out}
@keyframes lifeBrk{0%{transform:scale(1.4);background:#fff}35%{transform:scale(1.15) rotate(-16deg)}70%{transform:rotate(8deg)}100%{transform:none}}
#hLives .inf{font-family:var(--f-disp);font-size:1.3rem;color:#ef4444;padding:0 6px}
@keyframes hb{0%{transform:scale(1.5)}40%{transform:scale(.7) rotate(-15deg)}100%{transform:scale(1)}}
#goal{margin:10px auto 0;width:max-content;max-width:100%;display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-size:1.3rem;padding:4px 18px;border-radius:var(--r-pill);border:2px solid var(--target);background:var(--c-glass);box-shadow:0 0 16px color-mix(in srgb,var(--target) 45%,transparent);transition:border-color .3s}
#goal b{color:var(--target);font-weight:400;text-shadow:0 0 12px var(--target);filter:brightness(1.25)}
#goal .sym{font-style:normal;color:var(--target);font-size:1rem;display:none}
html.cb #goal .sym{display:inline}
#goal.pulse{animation:gp .6s ease-out 2}
@keyframes gp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
#pups{position:fixed;top:calc(var(--safe-t) + 64px);left:calc(var(--safe-l) + 10px);display:flex;flex-direction:column;gap:5px;pointer-events:none}
html.lefty #pups{left:auto;right:calc(var(--safe-r) + 10px)}
.pup{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--r-pill);background:var(--c-glass);border:1px solid var(--c);color:var(--c-text);font-family:var(--f-disp);font-size:.95rem;box-shadow:0 0 10px color-mix(in srgb,var(--c) 50%,transparent)}
@media (pointer:fine){html[data-state=play] #cv{cursor:none}}
#combo{margin:8px auto 0;width:max-content;text-align:center;font-family:var(--f-disp);color:var(--c-accent-l);text-shadow:0 0 14px #f59e0b,0 3px 0 #92400e;line-height:1;min-height:2rem;opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
#combo b{font-size:1.9rem;font-weight:400;display:block}
#combo small{font-family:var(--f-body);font-weight:800;font-size:.75rem;color:#fde68a;text-shadow:none}
#combo.pop b{animation:cp .32s ease-out}
@keyframes cp{0%{transform:scale(1.7)}100%{transform:scale(1)}}

/* ---------- screens ---------- */
#scr{position:fixed;inset:0;z-index:10;pointer-events:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:auto;padding:calc(var(--safe-t) + 12px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 18px) calc(var(--safe-l) + 16px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;opacity:0;transform:translateY(14px);transition:opacity var(--dur) ease,transform var(--dur) ease}
.screen.in{opacity:1;transform:none}
.screen.out{opacity:0;transform:translateY(-10px);pointer-events:none}
.screen.scrim{background:linear-gradient(180deg,rgba(var(--shade),.38),rgba(var(--shade),.74) 55%,rgba(var(--shade),.9))}
.screen.dark{background:radial-gradient(circle at 50% -10%,var(--screen-a),var(--screen-b) 60%)}
.screen.center>*{margin-top:auto;margin-bottom:auto}
.wrap{width:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:var(--sp-3)}
.grow{flex:1}
.top{display:flex;align-items:center;gap:var(--sp-2);position:sticky;top:0;z-index:3;margin:calc(-12px - var(--safe-t)) -16px 4px;padding:calc(var(--safe-t) + 12px) 16px 12px;background:linear-gradient(180deg,var(--top-bg) 75%,transparent)}
.pill.pop{animation:cp .3s ease-out}
.top h2{flex:1;margin:0;font-family:var(--f-disp);font-weight:400;font-size:1.6rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--r-pill);background:var(--c-glass);border:1px solid var(--c-line);font-family:var(--f-disp);font-size:1.1rem;white-space:nowrap}
.coin{width:1.05em;height:1.05em;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fffbe0,#facc15 42%,#b45309);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 6px rgba(250,204,21,.5);display:inline-block;vertical-align:-.15em}
.star{color:var(--c-gold);text-shadow:0 0 8px rgba(250,204,21,.6)}
.muted{color:var(--c-muted)}
.center-t{text-align:center}
h3{margin:0;font-family:var(--f-disp);font-weight:400}
p{margin:0;line-height:1.7}
.card{background:linear-gradient(180deg,var(--card-a),var(--card-b));border:1px solid var(--c-line);border-radius:var(--r-3);padding:var(--sp-4);box-shadow:0 12px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08)}
.logo{font-family:var(--f-disp);font-weight:400;text-align:center;line-height:.95;margin:0}
.logo b{display:block;font-weight:400;font-size:3.5rem;color:var(--logo);text-shadow:0 0 8px var(--logo-g1),0 0 26px var(--logo-g2),0 5px 0 var(--logo-d)}
.logo small{display:block;font-family:var(--f-body);font-weight:800;font-size:.85rem;letter-spacing:.4em;color:var(--c-accent);margin-top:10px;direction:ltr;text-shadow:0 0 10px rgba(251,191,36,.6)}
.logo.sm b{font-size:2.4rem}
html:not([lang=ar]) .logo small{letter-spacing:0;font-size:1.05rem}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.blink{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.mc{display:block;margin:0 auto;pointer-events:none}
.ver{font-size:.75rem;color:var(--c-dim);text-align:center}
.linkish{background:none;border:0;color:var(--c-muted);text-decoration:underline;cursor:pointer;font-size:.8rem;padding:6px}

/* ---------- menu ---------- */
.mtop{display:flex;align-items:center;gap:var(--sp-2)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.mgrid .btn{min-height:64px;font-size:1.15rem;flex-direction:column;gap:2px}
.mgrid .btn .e{font-size:1.4rem;line-height:1}

/* ---------- map ---------- */
.world{border-radius:var(--r-3);padding:var(--sp-3);background:#0d1428;background:linear-gradient(160deg,color-mix(in srgb,var(--wa) 24%,#0d1428),#0a1022 70%);border:1px solid color-mix(in srgb,var(--wa) 40%,transparent);scroll-margin-top:80px}
.world.lockw{filter:saturate(.35) brightness(.8)}
.whead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.wico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-disp);font-size:1.3rem;background:color-mix(in srgb,var(--wa) 35%,#0b1022);color:#fff;border:1px solid color-mix(in srgb,var(--wa) 60%,transparent);flex:none}
.wname{font-family:var(--f-disp);font-size:1.3rem;color:#fff;line-height:1.1}
.wnum{font-size:.72rem;color:var(--c-muted);font-weight:800}
.wst{margin-inline-start:auto;font-family:var(--f-disp);font-size:1.05rem;white-space:nowrap}
.wbar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);margin:0 2px 6px;overflow:hidden}
.wbar i{display:block;height:100%;background:var(--wa)}
.board{position:relative;display:grid;grid-template-columns:repeat(5,1fr)}
.board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:7px}
.node .sp{position:absolute;top:0;inset-inline-end:0;font-size:.85rem;line-height:1;z-index:1;filter:drop-shadow(0 1px 2px #000);pointer-events:none}
.lv{position:relative;width:100%;height:100%;border-radius:50%;border:3px solid color-mix(in srgb,var(--wa) 70%,#fff 0%);background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--wa) 40%,#1b2540),#0b1224 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-disp);font-size:1.3rem;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.5);cursor:pointer;padding:0;line-height:1}
.lv .st{font-family:var(--f-body);font-size:.6rem;letter-spacing:1px;min-height:.8rem;margin-top:2px;color:var(--c-gold)}
.lv .st i{font-style:normal;color:rgba(255,255,255,.2)}
.lv.boss{border-radius:30%;border-color:#ef4444;background:radial-gradient(circle at 35% 28%,#c81e1e,#3b0a12 80%)}
.lv.lock{filter:grayscale(1) brightness(.45);cursor:default;box-shadow:none}
.lv.cur{border-color:var(--c-accent);animation:pulse 1.6s ease-in-out infinite}
.lv:active:not(.lock){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.65),0 4px 0 rgba(0,0,0,.5)}50%{box-shadow:0 0 0 10px rgba(251,191,36,0),0 4px 0 rgba(0,0,0,.5)}}

/* ---------- saga map: a winding road from level 1 (bottom) up to the last level ---------- */
.screen.mapscr{padding-left:0;padding-right:0;padding-bottom:0}
.screen.mapscr .top{margin-left:0;margin-right:0}
.saga{position:relative;width:100%;max-width:560px;margin:0 auto;flex:none}
.zone{position:absolute;left:0;right:0;background:linear-gradient(0deg,var(--z3),var(--z2) 50%,var(--z1));-webkit-mask-image:linear-gradient(0deg,transparent,#000 70px);mask-image:linear-gradient(0deg,transparent,#000 70px)}
.zone.first{-webkit-mask-image:none;mask-image:none}
.zone::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:var(--stars,1);background-image:radial-gradient(1.6px 1.6px at 20% 30%,#fffc 50%,transparent),radial-gradient(1px 1px at 70% 15%,#fffb 50%,transparent),radial-gradient(1.4px 1.4px at 45% 62%,#fff9 50%,transparent),radial-gradient(1px 1px at 86% 76%,#fffb 50%,transparent),radial-gradient(1.2px 1.2px at 10% 88%,#fffa 50%,transparent);background-size:170px 230px}
.zone.lockz::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.38);pointer-events:none}
.zone svg,.road{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.sgn{position:absolute;font-family:var(--f-disp);font-size:.95rem;padding:2px 10px;border:2px solid var(--nc);border-radius:8px;color:#fff;background:rgba(6,8,24,.78);text-shadow:0 0 8px var(--nc);box-shadow:0 0 12px color-mix(in srgb,var(--nc) 60%,transparent);white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%) rotate(var(--rot,0deg))}
.gate{position:absolute;left:50%;transform:translate(-50%,-50%);width:min(86%,380px);padding:9px 14px;border-radius:18px;background:rgba(6,8,24,.88);border:2px solid var(--wa);box-shadow:0 0 22px color-mix(in srgb,var(--wa) 55%,transparent),inset 0 0 18px color-mix(in srgb,var(--wa) 25%,transparent);display:flex;align-items:center;gap:10px;color:#fff;z-index:2;pointer-events:none}
.gate .wnum{color:#cbd5e1}
.gate.lockg{border-color:#475569;box-shadow:none}
.sn{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;border:3px solid rgba(255,255,255,.92);background:radial-gradient(circle at 35% 28%,#ffffffd0 0,color-mix(in srgb,var(--wa) 80%,#fff) 20%,var(--wa) 55%,color-mix(in srgb,var(--wa) 50%,#000) 100%);color:#fff;font-family:var(--f-disp);font-size:1.45rem;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 6px 0 rgba(0,0,0,.42),0 10px 16px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.5);z-index:3}
.sn:active:not(.lock){transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.42)}
.sn.boss{width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:26px;border-color:#fde047;background:radial-gradient(circle at 35% 28%,#fecaca 0,#ef4444 38%,#7f1d1d);font-size:2rem}
.sn.lock{background:radial-gradient(circle at 35% 28%,#64748b,#1f2937 80%);border-color:#475569;cursor:default;font-size:1.05rem;box-shadow:0 5px 0 rgba(0,0,0,.4)}
.sn.done{border-color:#fde047}
.sn.cur{border-color:var(--c-accent);animation:pulse 1.6s ease-in-out infinite}
.sn .st{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-family:var(--f-body);font-size:.9rem;letter-spacing:-1px;white-space:nowrap;color:#facc15;text-shadow:0 0 6px rgba(250,204,21,.8),0 1px 0 #000;direction:ltr}
.sn .st i{font-style:normal;color:rgba(255,255,255,.4);text-shadow:0 1px 0 #000}
.sn .sp{position:absolute;bottom:-6px;inset-inline-end:-9px;font-size:1.05rem;filter:drop-shadow(0 1px 2px #000)}
.mc.you{position:absolute;z-index:4;margin:0;transform:translate(-50%,-100%)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(0,0,0,.25)}

.lbrow .who{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.lbrow .who small{font-size:.75rem;color:var(--c-muted);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbrow.bot{opacity:.86;border-style:dashed}
.vs{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 12px;border-radius:var(--r-2);background:var(--c-glass);border:1px solid var(--c-line);font-family:var(--f-disp);font-size:1.05rem}
.vs.win{border-color:var(--c-good)}
.namein{width:100%;border-radius:12px;border:1px solid var(--c-line-2);background:var(--input-bg);color:var(--input-fg);font:inherit;font-size:1.05rem;padding:10px 12px;user-select:text;-webkit-user-select:text}

/* ---------- modes ---------- */
.mode{display:flex;gap:var(--sp-3);align-items:center}
.mode .mi{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:1.9rem;flex:none;background:var(--mc,#26346a);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.mode h3{font-size:1.35rem}
.mode p{font-size:.82rem;color:var(--c-muted);line-height:1.5}
.mode .meta{font-size:.78rem;color:var(--c-accent);font-weight:800}
.mode .act{margin-inline-start:auto;flex:none}
.step{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:10px}
.step b{font-family:var(--f-disp);font-size:1.5rem;min-width:3ch;text-align:center}

/* ---------- shop ---------- */
.tabs{display:flex;gap:5px;background:var(--c-glass);padding:5px;border-radius:var(--r-2);border:1px solid var(--c-line)}
.tab{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:12px;font-family:var(--f-disp);font-size:.95rem;color:var(--c-muted);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--c-surface-3);color:var(--c-text);box-shadow:inset 0 -3px 0 var(--c-accent)}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-3)}
.item{display:flex;flex-direction:column;gap:8px;align-items:stretch;padding:var(--sp-3);text-align:center}
.item canvas{width:100%;height:112px;border-radius:12px;background:#050916;display:block}
.item h3{font-size:1.15rem}
.item.eq{border-color:var(--c-accent);box-shadow:0 0 0 2px rgba(251,191,36,.5),0 12px 32px rgba(0,0,0,.4)}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:none}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- lists ---------- */
.ach{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r-2);background:var(--panel);border:1px solid var(--c-line)}
.ach .ai{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;background:var(--panel-2);flex:none;filter:grayscale(1);opacity:.6}
.ach.done{border-color:rgba(251,191,36,.45)}
.ach.done .ai{background:linear-gradient(#fde047,#f59e0b);filter:none;opacity:1}
.ach .ab{flex:1;min-width:0}
.ach h3{font-size:1.08rem}
.ach p{font-size:.78rem;color:var(--c-muted);line-height:1.4}
.ach .rw{font-family:var(--f-disp);font-size:.95rem;white-space:nowrap;display:flex;align-items:center;gap:4px}
.bar{height:6px;border-radius:3px;background:var(--well);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-accent);border-radius:3px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.tile{padding:14px;border-radius:var(--r-2);background:var(--panel);border:1px solid var(--c-line)}
.tile b{display:block;font-family:var(--f-disp);font-weight:400;font-size:1.75rem;line-height:1.1}
.tile span{font-size:.78rem;color:var(--c-muted);font-weight:800}
.tile .e{font-size:1.1rem}
.lbrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r-2);background:var(--panel);border:1px solid var(--c-line)}
.lbrow .rk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-size:1.1rem;background:var(--c-surface-3);flex:none}
.lbrow:nth-child(1) .rk{background:linear-gradient(#fde047,#f59e0b);color:#3a1d00}
.lbrow:nth-child(2) .rk{background:linear-gradient(#e2e8f0,#94a3b8);color:#1e293b}
.lbrow:nth-child(3) .rk{background:linear-gradient(#fdba74,#c2410c);color:#3a1300}
.lbrow b{font-family:var(--f-disp);font-weight:400;font-size:1.35rem}
.lbrow .d{margin-inline-start:auto;font-size:.75rem;color:var(--c-muted);text-align:end}
.lbrow.me{border-color:var(--c-accent)}
.empty{padding:28px 16px;text-align:center;color:var(--c-muted)}

/* ---------- settings ---------- */
.sec h3{font-size:1.15rem;color:var(--c-accent);margin-bottom:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;border-top:1px solid var(--c-line);padding:6px 0}
.sec h3+.row{border-top:0}
.row label,.row .rl{flex:1;min-width:0;font-size:.95rem}
.row .rl small{display:block;font-size:.72rem;color:var(--c-muted);font-weight:600;line-height:1.35}
.seg{display:flex;background:var(--well);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.seg button{border:0;background:transparent;padding:7px 10px;border-radius:9px;font-size:.82rem;font-weight:800;color:var(--c-muted);cursor:pointer;font-family:var(--f-body);white-space:nowrap}
.seg button.on{background:var(--c-accent);color:var(--c-on-accent)}
.sw{width:52px;height:30px;border-radius:15px;border:0;background:var(--track);position:relative;cursor:pointer;flex:none;transition:background .2s;padding:0}
.sw::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.4);transition:inset-inline-start .2s}
.sw[aria-checked=true]{background:var(--c-good)}
.sw[aria-checked=true]::after{inset-inline-start:25px}
input[type=range]{-webkit-appearance:none;appearance:none;width:52%;max-width:220px;height:30px;background:transparent;cursor:pointer;direction:ltr}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--c-accent) var(--v,50%),var(--track) var(--v,50%))}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--c-accent) var(--v,50%),var(--track) var(--v,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-8px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.btnrow{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.btnrow .btn{flex:1}
textarea{width:100%;min-height:140px;border-radius:12px;border:1px solid var(--c-line-2);background:var(--input-bg);color:var(--input-fg);font:16px/1.5 ui-monospace,Consolas,monospace;padding:10px;direction:ltr;resize:vertical;user-select:text;-webkit-user-select:text}
.note{font-size:.78rem;color:var(--c-muted);line-height:1.5}
.clog{margin:0;padding-inline-start:20px;font-size:.85rem;line-height:1.7;color:var(--c-muted)}
.clog b{color:var(--c-text)}

/* ---------- end / pause / intro ---------- */
.panel{width:100%;max-width:400px;margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.panel h1{margin:0;font-family:var(--f-disp);font-weight:400;font-size:2.5rem;line-height:1.05;color:var(--logo);text-shadow:0 0 10px var(--logo-g1),0 0 28px var(--logo-g2),0 5px 0 var(--logo-d)}
.panel h1.bad{color:#fff;text-shadow:0 0 10px #f87171,0 0 28px #b91c1c,0 5px 0 #7f1d1d}
.stars{display:flex;gap:10px;justify-content:center;min-height:56px;align-items:center}
.stars i{font-style:normal;font-size:2.8rem;line-height:1;color:var(--star-off);text-shadow:0 3px 0 rgba(0,0,0,.4);transition:color .2s}
.stars i.on{color:var(--c-gold);text-shadow:0 0 18px rgba(250,204,21,.8),0 3px 0 #b45309;animation:sp .45s cubic-bezier(.2,1.6,.4,1)}
.stars i:nth-child(2){font-size:3.4rem;margin-top:-12px}
@keyframes sp{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1)}}
.bigscore{font-family:var(--f-disp);font-size:2.6rem;line-height:1;color:var(--c-accent-l);text-shadow:0 0 16px rgba(245,158,11,.6),0 4px 0 #92400e}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:var(--r-pill);background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.5);color:var(--c-accent-l);font-weight:800;font-size:.85rem}
.chip.new{animation:cp .5s ease-out}
.earn{font-family:var(--f-disp);font-size:1.5rem;display:flex;align-items:center;gap:8px;justify-content:center}
.endbtns{display:flex;flex-direction:column;gap:var(--sp-3);width:100%;margin-top:4px}
.endbtns .btnrow .btn{min-height:50px}
.cheer{font-size:1.05rem;color:var(--cheer)}
.tip{font-size:.85rem;color:var(--c-muted);background:var(--c-glass);border:1px solid var(--c-line);border-radius:var(--r-2);padding:10px 14px;line-height:1.6;max-width:400px}
.pausebox{width:100%;max-width:380px;margin:auto}
.pausebox .btn{width:100%}
.introcv{width:200px;height:130px;margin:0 auto;display:block}
.newtag{display:inline-block;background:var(--c-pink);color:#fff;font-family:var(--f-disp);font-size:1rem;padding:2px 14px;border-radius:var(--r-pill);box-shadow:0 0 16px rgba(255,62,165,.6)}

/* ---------- overlays ---------- */
#cd{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#cd.on{display:flex}
#wcard{position:absolute;top:calc(var(--safe-t) + 16%);left:16px;right:16px;text-align:center;opacity:0;--wc:#22d3ee}
#wcard.on{animation:wcard 2.3s ease-out forwards}
#wcard small{display:block;font-weight:800;font-size:.8rem;letter-spacing:.22em;color:#fff;opacity:.9;text-shadow:0 1px 4px rgba(0,0,0,.6)}
#wcard b{display:block;font-family:var(--f-disp);font-weight:400;font-size:2.5rem;line-height:1.1;color:#fff;text-shadow:0 0 6px var(--wc),0 0 18px var(--wc),0 0 38px var(--wc)}
@media (max-height:700px){#wcard{top:calc(var(--safe-t) + 21%)}#wcard b{font-size:1.9rem}}
@keyframes wcard{0%{opacity:0;transform:scale(.94)}7%{opacity:1}11%{opacity:.25}15%{opacity:1}19%{opacity:.5}25%,82%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.03)}}
.sn.lock.devo{outline:2px dashed #f59e0b;outline-offset:2px;opacity:1}
.vbtn{display:block;width:100%;background:none;border:0;padding:12px 8px;font:inherit;font-size:.75rem;color:var(--c-dim);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.item p.sk{font-size:.72rem;color:var(--c-muted);margin:0 0 4px;line-height:1.35;min-height:2.7em}
.item canvas.dim{filter:grayscale(1) brightness(.6)}
.lvchip{display:inline-flex;align-items:center;padding:3px;border-radius:var(--r-pill);background:var(--panel);border:1px solid var(--c-line);color:var(--c-text);font-weight:800;font-size:.8rem;cursor:pointer}
.lvchip .ring{width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--c-accent) calc(var(--p) * 1%),var(--well) 0);display:grid;place-items:center;flex:none}
.lvchip .ring b{width:27px;height:27px;border-radius:50%;background:var(--panel-2);display:grid;place-items:center;font-family:var(--f-disp);font-weight:400;font-size:.95rem;line-height:1}
.evban{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;border-radius:var(--r-2);background:linear-gradient(100deg,#3b0764,#7c3aed);color:#fff;border:1px solid rgba(253,230,138,.55);font-weight:800;font-size:.9rem;text-align:start;cursor:pointer}
.evban.eid{background:linear-gradient(100deg,#065f46,#0d9488)}
.evban .e{font-size:1.6rem;flex:none}
.evban .grow{min-width:0}
.evban small{display:block;font-weight:700;opacity:.88;font-size:.74rem}
.evban .bar{background:rgba(255,255,255,.22);margin-top:4px}.evban .bar i{background:#fde68a}
@media (max-height:820px){.evban{padding:6px 12px}.evban .e{font-size:1.2rem}.evban .bar{display:none}.evban small{display:inline;margin-inline-start:6px}}
.xprow{display:flex;align-items:center;gap:8px;width:100%;max-width:300px;margin:0 auto;font-weight:800;font-size:.82rem}
.xprow .bar{flex:1;margin:0;height:8px}
.xprow .bar i{transition:width .9s cubic-bezier(.2,.8,.2,1)}

<script>
'use strict';
/* =====================================================================
   STICKBOLT (formerly Falling Sticks)
   One self-contained file: Canvas 2D + WebAudio, no libraries.
   Sections:
     1. CONFIG      – every tunable number lives here
     2. UTILS
     3. I18N        – Arabic / English strings
     4. SAVE        – versioned localStorage save + migrations
     5. AUDIO       – mixer, SFX, generated music
     6. RENDER      – layout, caches, city, machine, sticks, FX, mascot
     7. GAME        – level generator, modes, rules, tutorial
     8. UI          – state machine + DOM screens
     9. BOOT
   ===================================================================== */

/* ============================ 1. CONFIG ============================ */
const VERSION = '1.1.2';

/** Central tuning table. Change numbers here, not inside the code. */
const CFG = {
  lanes: 9,                                   // sticks hanging on the arch
  layout: { arcTop: .2, arcSag: 34, floor: .86, laneFrom: .07, laneTo: .79, stageAspect: .62, stageMax: 560, stickLen: 70, stickW: 11, fallRef: 1.75 },
  menuUnlock: { shop: 1, ach: 1, modes: 3, lb: 3, stats: 5, missions: 5, pets: 5 },   // menu buttons appear once this many levels are cleared (new players are not flooded)
  diff: {                                     // difficulty presets (settings)
    easy:   { lives: 5, grav: .8,   itv: 1.12, coin: 1 },
    normal: { lives: 3, grav: 1,    itv: 1,    coin: 1 },
    hard:   { lives: 2, grav: 1.22, itv: .9,   coin: 1.5 },
  },
  level: {                                    // cfg(n) formula coefficients
    goalBase: 8, goalStep: 6, bossGoal: 4,    // goal = base + floor(n/step) (+boss)
    itvBase: .95, itvStep: .006, itvMin: .38, bossItv: .12, // seconds between drops
    gBase: 1.5, gStep: .012,                  // gravity in screen-heights / s²
    decoyBase: .2, decoyStep: .004, decoyMax: .65, // chance a drop is NOT the target
    warnBase: .42, warnStep: .0015, warnMin: .22,  // shake time before a drop
  },
  unlock: { colors3: 6, switch: 10, gold: 31, double: 61, twoTone: 76, bomb: 91, wind: 106, shift: 121, rise: 136 },
  chance: { gold: .09, bomb: .13, double: .22, shift: .14, twoTone: .1, rise: .14, lantern: .06, switchEvery: 9, pity: 3, shiftWin: [.15, .35], doubleGap: 3, doubleStart: .06, doubleRamp: .005 },
  combo: { step: 5, maxMul: 10 },             // +1 multiplier every `step` catches
  score: { catch: 10, gold: 20 },
  slowmo: { gold: .55, scale: .35, win: .75, boss: 1.4, lose: .5 },
  coins: { win: 10, perStar: 5, boss: 40, firstClear: 10, loseDiv: 3, endlessDiv: 40, daily: 60 },
  dailyRewards: [20, 30, 40, 60, 80, 100, 150],
  endless: { catchesPerLevel: 3 },           // endless climbs one virtual level per N catches
  daily: { goal: 15, minLevel: 10, span: 60 },
  endLockMs: 1400,                            // end-screen buttons disabled for this long
  tutorialGravity: .3,
  cinema: { length: 16, gravity: .55 },                 // first-run intro: seconds, slower falls
  defaultTheme: 'day',                                  // day | sunset | night | retro | ocean | contrast | auto
  history: { backups: 12, log: 80, autoMin: 15 },       // save history: backups kept, log entries kept, minutes between auto backups
  hit: { touch: 14, mouse: 6, vert: 12, lag: .08, lagTone: .09, favor: 8 },  // tap tolerance around the stick body (× u); lag = finger-to-event delay (s); favor = pull toward the stick you want (× u)
  hitStop: { catch: .045, bomb: .09 },                  // tiny freeze on impact (seconds)
  quick: { frac: .34, bonus: 5 },                       // "Quick!" = caught in the first third of the fall (+bonus × multiplier)
  drone: { from: 16, every: [20, 30], speed: .17, slow: 3, slowScale: .55, magnet: 5, magnetMul: 2.6, x2: 10 },
  mascotInPlay: false,                          // Bebo the robot was removed in 2.11 (user decision); the companion pet shows on the map, profile and end screens
  zap: { from: 1, below: [.5, .5], ramp: [12, 30], assist: .5, show: 1.3 },   // electric zone: an invisible line `below` stick lengths under the hanging sticks (×assist); a grab above it = zap (combo lost, no heart lost) and the line flashes up for `show` s
  live: { from: 2, chance: .05, max: .1, full: 60, bait: .7, gap: 4, forceAt: 2 },   // live sticks: share of drops (5% at level 2 → 10% at 60, half with assist), mostly in the target colour, at least `gap` drops apart, one on screen at a time
  feint: { from: 18, chance: .22, ramp: .003, max: .5, two: .35, bait: .7 },   // fake shakes: chance per drop (+ramp per level), sometimes 2, mostly in the target colour
  spring: { from: 3, early: 15, dur: 10, first: [4, 7], passes: 2 },   // bouncy springs power-up: a drone brings it once per level in levels from..early, later it is one of the drone powers
  review: { first: 3, gap: [10, 18], days: 2, max: 5 },              // Play rating card: first after a 2+ star win from level 3, then every 10-18 levels (2+ days apart), at most 5 times
  cat: { from: 17, every: [16, 28], speed: 44, saves: 1, goldCoins: 5 },
  special: {                                            // special level types by position inside a world
    survive: { idx: 7, fromWorld: 1, base: 14, perWorld: 2 },   // seconds = base + world × perWorld; was 22 + 2w (2.11.1): the timer ran ~1.6× longer than a regular level next to it, a 20-35 point win-rate cliff in the balance sim
    goldRain: { idx: 11, fromWorld: 2, chance: .18, goalMul: 1.1 },
    dark: { idx: 13, fromWorld: 3 },
    flash: { idx: 9, fromWorld: 1, first: 2.2, every: [3, 5], charge: .5, fade: .75, hold: .24, peak: .97, peakAssist: .8, peakReduced: .55 },   // camera flash: the lens glows, then a white burst blinds the screen; never more than one flash per 3 s (photosensitivity)
  },
  boss: {                                               // twists per world boss (index = world)
    twists: [['rapid'], ['fake'], ['blackout'], ['swap'], ['rapid', 'enrage'], ['fake', 'blackout'], ['swap', 'enrage'], ['blackout', 'rapid'], ['fake', 'swap'], ['rapid', 'fake', 'blackout', 'swap', 'enrage']],
    rapidEvery: 6, rapidCount: 2, fakeChance: .16, blackEvery: 7, blackFor: 1.4, swapEvery: 6, swapGoal: 4, enrageG: 1.15, enrageItv: .9,
    // balance pass after 2.11.1 (sim: boss 60 novice 9% vs ~45% before it, boss 105 average 27% vs ~70%): swapEvery 4 -> 6,
    // swap bosses need swapGoal fewer catches (no boss bonus on top of the swap twist), enrage 1.25/.8 -> 1.15/.9
  },
  missions: { perDay: 3, allBonus: 50 },
  wind: { force: 34, every: [4, 8] },                   // sideways drift (px × u / s) and seconds between gusts
  assist: { after: 3, grav: .8, itv: 1.25, warn: 1.3 }, // smart assist after N failed tries on the same level
  floorSticks: 3,
  pets: { unlock: { cat: 1, pup: 16, bunny: 31, duck: 46 }, fetch: 2, fetchCoins: 4, saves: 1, calm: 5, quickMul: 1.5 },   // companion unlock level + skills                                       // extra sticks that shoot up from the platform (level 136+)
  xp: { perHit: 1, win: 20, perStar: 10, boss: 50, daily: 30, endlessDiv: 40, mission: 25, base: 100, step: 20, max: 99 },
  titles: [1, 5, 10, 15, 20, 30, 50],                   // player level at which each title in STR.titles unlocks
  stickerSet: 150,                                      // coins for a complete world sticker set
  ramadan: [{ n: 20, coins: 100 }, { n: 50, item: ['pet', 'lantern'] }, { n: 100, coins: 300 }],   // lantern event rewards
  online: { apiKey: 'AIzaSyDopbvYGXjYGMNMXce72i3oANntX1zf-9s', projectId: 'stick-scores', size: 50, max: 5000000 },   // Firebase project for the online high scores (empty = off); see store/high-scores-setup.html
};

/** Graphics presets. `auto` picks one of these by measuring FPS. */
const QUALITY = {
  high:   { dpr: 3,   particles: 320, pmul: 1,   glow: true,  trail: 3, cars: 4, clouds: 4, rain: 70, ads: true },   // dpr is capped by the screen
  medium: { dpr: 2,   particles: 200, pmul: .7,  glow: true,  trail: 2, cars: 2, clouds: 3, rain: 40, ads: true },
  low:    { dpr: 1.5, particles: 90,  pmul: .4,  glow: false, trail: 0, cars: 0, clouds: 2, rain: 16, ads: false },
};

/** Gameplay colours (the only colours a target can be). */
const COLORS = {
  b: { hex: '#3b82f6', light: '#93c5fd', sym: '●' },
  g: { hex: '#22c55e', light: '#86efac', sym: '▲' },
  r: { hex: '#ef4444', light: '#fca5a5', sym: '■' },
};
const COLOR_KEYS = ['b', 'g', 'r'];
/** Decorative colours for hanging sticks (pink, red, orange, yellow, green, blue). */
const DECOR = ['#ff4d8d', '#ef4444', '#fb923c', '#facc15', '#22c55e', '#3b82f6'];
const GOLD_HEX = '#fbbf24', BOMB_HEX = '#2b3446', LAMP_HEX = '#a855f7';
/** UI themes. `tod` = time of day used for the city scene; `meta` = browser bar colour. */
const THEMES = {
  sunset: { tod: 'sunset', meta: '#1a0b26' }, day: { tod: 'day', meta: '#e8f4ff' }, night: { tod: 'night', meta: '#070b16' },
  retro: { tod: 'night', meta: '#1b1036' }, ocean: { tod: 'night', meta: '#031a24' }, contrast: { tod: 'night', meta: '#000000' },
};

/** Ten night-city worlds: palette, neon, ambience and music. */
const WORLDS = [

/* ============================ 2. UTILS ============================ */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Math.round(n).toLocaleString('en-US');
/** "+N" wrapped in a left-to-right isolate so RTL text does not flip it to "N+". */
const plus = n => '⁦+' + n + '⁩';
const pick = (arr, r = Math.random) => arr[Math.floor(r() * arr.length) % arr.length];
/** Small fast seeded PRNG (mulberry32). */
function rng32(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return h >>> 0; }
/** Local calendar day as YYYY-MM-DD. */
function dayKey(d = new Date()) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function hms(ms) { const s = Math.max(0, Math.floor(ms / 1000)); return [s / 3600 | 0, (s / 60 | 0) % 60, s % 60].map(v => String(v).padStart(2, '0')).join(':'); }
/** Hex colour + alpha → rgba string (used only when building caches). */
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }
/** Mix two hex colours. */
function mix(h1, h2, t) { const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16); const c = (s) => Math.round(lerp((a >> s) & 255, (b >> s) & 255, t)); return '#' + ((1 << 24) | (c(16) << 16) | (c(8) << 8) | c(0)).toString(16).slice(1); }
const totalStars = s => s.stars.reduce((a, b) => a + (b || 0), 0);
const cleared = (s, upTo) => { let n = 0; for (let i = 0; i < upTo; i++) if (s.stars[i]) n++; return n; };

/** Timers bound to the current screen: all cleared on every state change. */
const Timers = {
  ids: new Set(),
  set(fn, ms) { const id = setTimeout(() => { this.ids.delete(id); fn(); }, ms); this.ids.add(id); return id; },
  every(fn, ms) { const id = setInterval(fn, ms); this.ids.add(id); return id; },
  clear() { this.ids.forEach(id => { clearTimeout(id); clearInterval(id); }); this.ids.clear(); },
};

  },
  /** Is this falling stick still in the electrified zone under the arch? */

  inZap(s) { return this.zapOn() && !s.up && !s.bounced && s.st === ST.FALL && s.y < this.zapY(s.x); },
  zap(s, px, py) {

    FX.burst(px, py, '#7dd3fc', 14, 280 * u, 0, .35); FX.burst(px, py, '#ffffff', 6, 200 * u, 0, .25); FX.ring(px, py, '#7dd3fc', 34 * u, .25, 3 * u);

    if (s.k === KIND.BOMB) {

      FX.ring(cx, cy, '#fb923c', 95 * u, .5, 6 * u); FX.text(cx, cy - 30 * u, '💥', '#ffffff', 40 * u);

      FX.burst(cx, cy, GOLD_HEX, 28, 380 * u, 250 * u, .8); FX.burst(cx, cy, '#ffffff', 10, 220 * u, 0, .5); FX.ring(cx, cy, GOLD_HEX, 80 * u, .45, 5 * u);
      FX.text(cx, cy - 26 * u, '+2', '#fde047', 36 * u);

  /** Endless: difficulty climbs one virtual level every few catches; worlds change on the way. */
  endlessStep() {

  land(s) {

    if (!s.up && !this.ending && Pets.skillLand(s)) return;   // duck: second chance

/** Google Play rating card (Android app only): first after a 2+ star win from level 3, then now and then on later levels
    (every CFG.review.gap levels, days apart, at most max times). Never after a loss or during a run; Play itself also limits how often it shows. */
const Review = {
  wait: false, force: false,
  ok() { return (IN_APP || this.force) && !!window.FSNative && typeof window.FSNative.review === 'function'; },
  onEnd(r) {
    const R = CFG.review, s = save.review, n = Game.n;
    if (!this.ok() || !r || r.test || Game.mode !== 'level' || !r.win || (r.stars || 0) < 2 || s.n >= R.max) return false;
    if (s.n === 0 ? n < R.first : n < s.next || Date.now() - s.at < R.days * 864e5) return false;
    s.n++; s.at = Date.now(); s.next = n + R.gap[0] + Math.floor(Math.random() * (R.gap[1] - R.gap[0] + 1)); persist(true);
    setTimeout(() => { if (SM.state === 'end') this.ask(); else this.wait = true; }, 2600);   // after the stars; if the player already moved on, at the next map visit
    return true;
  },
  ask() { this.wait = false; try { window.FSNative.review(); } catch (e) { /* not available */ } },
};
/** Turns a finished run into saved progress + an end-screen result. */
const Progress = {
  record(G) { return G.test ? this.dry(() => this.apply(G)) : this.apply(G); },
  /** Developer test run: build the normal result, then put the save back exactly as it was. */
  dry(fn) {
    const snap = JSON.stringify(save); let r;
    History.off = true;
    try { r = fn(); } finally { save = migrate(JSON.parse(snap)); History.off = false; persist(true); UI.coins(); }
    return Object.assign(r, { test: true, coins: 0, xp: 0, ups: [], evRewards: [], stickers: [], achs: [], missions: [], newBest: false, rank: 0, daily: false });
  },
  apply(G) {
    const s = save, st = s.stats, win = G.endWin, mode = G.mode, C = CFG.coins, D = CFG.diff[s.settings.diff] || CFG.diff.normal;
    const att = G.hits + G.wrong + G.missed;
    const r = { mode, n: G.n, startN: G.startN, seed: G.seed, w: G.w, win, score: G.score, caught: G.caught, hits: G.hits, goal: G.L.goal, lost: G.lost, boss: G.L.boss, stars: 0, coins: 0, survive: G.L.survive, gt: G.gt, missions: [],
      newBest: false, best: 0, rank: 0, daily: false, acc: att ? Math.round(G.hits / att * 100) : 100, coinsBefore: s.coins, achs: [] };
    if (mode === 'tutorial') return r;
    st.caught += G.hits; st.wrong += G.wrong; st.missed += G.missed; st.games++; st.playTime += G.real;
    st.gold += G.goldN; st.bombsDodged += G.bombs; if (G.maxCombo > st.bestCombo) st.bestCombo = G.maxCombo;
    st.quick += G.quickN; st.power += G.powerN; st.pets += G.pets; st.catSaves += G.catSaves;
    const starsFor = () => G.lost === 0 ? 3 : G.lost === 1 ? 2 : 1;
    if (mode === 'level') {
      if (win) {
        st.wins++; r.stars = starsFor();
        const old = s.stars[G.n - 1] || 0;
        r.first = !old;
        if (r.stars > old) { s.stars[G.n - 1] = r.stars; History.log('win', [G.n, r.stars]); }
        if (G.lost === 0) st.flawless++;
        if (G.L.boss) {
          if (!s.bossBeat[G.w]) { r.firstBoss = true; History.log('boss', [G.w]); if (G.w + 1 < NW) History.log('world', [G.w + 1]); }
          s.bossBeat[G.w] = 1;
        }
        if (s.settings.diff === 'hard') st.hardWins++;
        r.coins = (C.win + r.stars * C.perStar + (G.L.boss ? C.boss : 0) + (r.first ? C.firstClear : 0)) * D.coin;
      } else r.coins = Math.floor(G.caught / C.loseDiv);
      const ob = s.best[G.n - 1] || 0;
      if (G.score > ob) { s.best[G.n - 1] = G.score; r.newBest = ob > 0; }
      r.best = Math.max(ob, G.score);
    } else if (mode === 'endless') {
      if (G.score > s.endlessBest) { r.newBest = s.endlessBest > 0; s.endlessBest = G.score; History.log('best', ['endless', G.score]); }
      r.best = s.endlessBest;
      r.coins = Math.floor(G.score / C.endlessDiv);
      r.hs = 'endless'; HS.submit('endless', G.score, G.n); if (r.best === G.score) s.endlessLv = G.n;
    } else if (mode === 'daily') {
      const today = dayKey();
      if (s.dailyCh.date !== today) s.dailyCh = { date: today, done: false, best: 0 };
      if (win) { st.wins++; r.stars = starsFor(); r.coins = C.win * D.coin; if (!s.dailyCh.done) { s.dailyCh.done = true; st.dailyWins++; r.daily = true; r.coins += C.daily; History.log('daily'); } }
      else r.coins = Math.floor(G.caught / C.loseDiv);
      if (G.score > s.dailyCh.best) { r.newBest = s.dailyCh.best > 0; s.dailyCh.best = G.score; }
      r.best = s.dailyCh.best;
      r.hs = 'daily'; HS.submit('daily', G.score, G.n);
    } else if (mode === 'practice') { st.practice++; s.practiceLv = G.n; }
    r.coins = Math.round(r.coins + G.bonusCoins);
    addCoins(r.coins);
    r.missions = Missions.track(G, r);
    if (mode === 'level') { if (win) delete s.fails[G.n]; else s.fails[G.n] = (s.fails[G.n] || 0) + 1; }
    r.xp = Player.xpFor(G, r); r.xpFrom = s.xp; r.ups = Player.gain(r.xp);
    r.lanterns = G.lanterns; r.evRewards = Season.add(G.lanterns) || [];
    r.stickers = Album.check();
    r.achs = Ach.check();
    persist();
    History.autoBackup(r.firstBoss);
    return r;
  },
  /** Quitting mid-run still counts the time and catches in the stats. */
  abandon(G) {
    if (G.mode === 'tutorial' || G.mode === 'attract' || G.mode === 'none' || G.test) return;
    const st = save.stats;
    st.caught += G.hits; st.wrong += G.wrong; st.missed += G.missed; st.playTime += G.real; st.gold += G.goldN; st.bombsDodged += G.bombs;
    if (G.maxCombo > st.bestCombo) st.bestCombo = G.maxCombo;
    st.quick += G.quickN; st.power += G.powerN; st.pets += G.pets; st.catSaves += G.catSaves;
    Missions.toast(Missions.track(G, null), 300);
    Season.add(G.lanterns);
    Ach.toastAll(Ach.check(), 300);
    persist(true);
  },
};

const Ach = {
  /** Unlock every achievement whose progress reached its goal; returns the new ones. */
  check() {
    const out = [];
    for (const a of ACH) if (!save.ach[a.id] && a.p(save) >= a.goal) { save.ach[a.id] = Date.now(); save.coins += a.rw; save.stats.coinsEarned += a.rw; out.push(a); History.log('ach', [a.id]); }
    if (out.length) persist(true);
    return out;
  },
  name: a => achText(a.id, 0),
  desc: a => achText(a.id, 1).replace('{0}', fmt(a.goal)),
  toastAll(list, delay) { const g0 = toastGen; list.forEach((a, i) => setTimeout(() => { if (g0 !== toastGen) return; UI.toast(a.ico, Ach.name(a), t('achNew') + ' ' + plus(a.rw)); Sound.play('unlock'); UI.coins(); }, (delay || 0) + i * 1300)); },
};

/** Local leaderboard. Set CFG.leaderboard.url to also POST scores to a server. */
/* ---------- online high scores: Firebase anonymous auth + Firestore REST, no SDK ---------- */
/** One entry per player per board (Endless, and one board per day for the daily challenge). Scores wait in
 *  save.hs.q until they reach the server, so playing offline loses nothing. firestore.rules checks every write. */
const HS = {
  KEY: 'fs_online', view: {}, sending: null,
  /** Names are English letters, digits, spaces and _ . - only (also enforced by firestore.rules). */
  OK_CH: /[^A-Za-z0-9 _.-]/g,
  // Refused anywhere inside the name (after leetspeak, separators and repeated letters are undone).
  BAD: ['fuck', 'fuk', 'fck', 'fvck', 'phuck', 'motherf', 'shit', 'bitch', 'biatch', 'cunt', 'dick', 'cock', 'pussy', 'nigg', 'nigga', 'faggot', 'rape', 'nazi', 'hitler', 'kkk',
    'slut', 'whore', 'porn', 'penis', 'vagina', 'asshole', 'bastard', 'retard', 'twat', 'wank', 'jizz', 'kike', 'chink', 'dildo', 'blowjob', 'handjob', 'boob', 'tits',
    'titty', 'milf', 'horny', 'nude', 'naked', 'sexy', 'xxx', 'piss', 'bollock', 'clit', 'semen', 'orgasm', 'incest', 'molest'],
  // Refused only as a whole word (too short to search inside other words).
  BAD_W: ['ass', 'arse', 'hoe', 'cum', 'tit', 'anal', 'anus', 'sex', 'fag', 'kys', 'stfu', 'fk', 'dik', 'spic', 'prick', 'pedo'],
  // Innocent words that contain a bad one ("grape", "Peacock", "Scunthorpe"...).
  GOOD: ['grape', 'drape', 'scrape', 'trapez', 'rapese', 'parapet', 'therap', 'peacock', 'hancock', 'hitchcock', 'babcock', 'woodcock', 'cockpit', 'cocktail', 'cockatoo', 'cockerel',
    'dickens', 'dickson', 'dickinson', 'benedick', 'scunthorpe', 'shitake', 'shiitake', 'penistone', 'nazir', 'nazim', 'swank', 'pissarro', 'fukushima', 'fukuda'],
  on() { return !!(CFG.online.apiKey && CFG.online.projectId); },
  /** Keep English letters, digits, spaces and _ . - only; 12 characters at most. */
  clean(v) { return String(v || '').normalize('NFKC').replace(this.OK_CH, '').replace(/\s+/g, ' ').trim().slice(0, 12); },
  /** True when a typed name has characters a High Scores name may not use (other alphabets, emoji, symbols). */
  latin(v) { return !String(v || '').normalize('NFKC').trim().replace(/\s+/g, ' ').match(/[^A-Za-z0-9 _.-]/); },
  bad(v) {
    const leet = s => s.toLowerCase().replace(/0/g, 'o').replace(/1/g, 'i').replace(/3/g, 'e').replace(/4/g, 'a').replace(/5/g, 's').replace(/7/g, 't').replace(/8/g, 'b').replace(/9/g, 'g');
    const one = s => s.replace(/(.)\1+/g, '$1'), raw = leet(this.clean(v));
    if (raw.split(/[\s_.-]+/).some(w => this.BAD_W.includes(w) || this.BAD_W.includes(one(w)) && one(w).length > 2)) return true;
    const strip = (s, f) => this.GOOD.reduce((z, w) => z.split(f(w)).join(' '), s);
    const z = raw.replace(/[\s_.-]/g, ''), zs = strip(z, w => w), zo = strip(one(z), one);
    if (this.BAD_W.includes(z) || this.BAD_W.includes(one(z))) return true;

  },
  id(b) { return b === 'endless' ? 'endless' : 'daily-' + dayKey(); },
  live(id) { return id === 'endless' || id === 'daily-' + dayKey(); },
  url(path) { return 'https://firestore.googleapis.com/v1/projects/' + CFG.online.projectId + '/databases/(default)/documents/' + path; },
  creds() { try { return JSON.parse(Store.get(this.KEY) || 'null'); } catch (e) { return null; } },
  me() { const c = this.creds(); return c ? c.uid : ''; },
  /** An anonymous Firebase account per device (no sign-in screen); its id is the player's entry on every board. */
  async token() {
    const k = CFG.online.apiKey, now = Date.now(); let c = this.creds();
    if (c && c.tok && c.exp > now + 60000) return c;
    if (c && c.ref) {
      const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + k, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(c.ref) }).catch(() => null);
      if (!r) return null;                                         // offline: try again later with the same account
      if (r.ok) { const j = await r.json(); c = { uid: j.user_id, tok: j.id_token, ref: j.refresh_token, exp: now + (j.expires_in | 0) * 1000 }; Store.set(this.KEY, JSON.stringify(c)); return c; }
      if (r.status !== 400) return null;                           // only a dead refresh token makes a new account
    }
    const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + k, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{"returnSecureToken":true}' }).catch(() => null);
    if (!r || !r.ok) return null;
    const j = await r.json(); c = { uid: j.localId, tok: j.idToken, ref: j.refreshToken, exp: now + (j.expiresIn | 0) * 1000 };
    Store.set(this.KEY, JSON.stringify(c)); return c;
  },
  /** Remember a score for a board if it beats what this player already has there. */
  submit(b, score, lv, force) {
    score = Math.floor(score); if (!(score > 0) || score >= CFG.online.max) return;
    const id = this.id(b), H = save.hs, q = H.q.find(e => e.id === id);
    if (!force && score <= Math.max(H.sent[id] || 0, q ? q.s : 0)) return;
    if (q) { q.s = Math.max(q.s, score); q.lv = lv | 0; } else H.q.push({ id, s: score, lv: lv | 0 });
    persist(true);
  },
  /** Send everything that is waiting. Resolves when done (or right away when off, offline or nameless). */
  flush() {
    if (this.sending) return this.sending;
    const H = save.hs; H.q = H.q.filter(e => this.live(e.id));
    for (const k of Object.keys(H.sent)) if (!this.live(k)) delete H.sent[k];
    if (!this.on() || !save.name || !H.q.length) return Promise.resolve();
    this.sending = (async () => {
      const c = await this.token(); if (!c) return;
      for (const e of H.q.slice()) {
        const body = { fields: { name: { stringValue: this.clean(save.name) }, score: { integerValue: String(e.s) }, lv: { integerValue: String(e.lv | 0) } } };
        const r = await fetch(this.url('boards/' + e.id + '/scores/' + c.uid), { method: 'PATCH', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + c.tok }, body: JSON.stringify(body) }).catch(() => null);
        if (!r) break;                                             // offline: keep the queue
        if (r.ok) H.sent[e.id] = Math.max(H.sent[e.id] || 0, e.s);
        if (r.ok || r.status === 400 || r.status === 403) H.q.splice(H.q.indexOf(e), 1);   // refused scores are dropped
      }
      persist(true); delete this.view.endless; delete this.view.daily;
    })().catch(() => {}).finally(() => { this.sending = null; });
    return this.sending;
  },
  /** Top scores of a board, best first. */
  async list(b) {
    const body = { structuredQuery: { from: [{ collectionId: 'scores' }], orderBy: [{ field: { fieldPath: 'score' }, direction: 'DESCENDING' }], limit: CFG.online.size } };
    const r = await fetch(this.url('boards/' + this.id(b)) + ':runQuery?key=' + CFG.online.apiKey, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('hs ' + r.status);
    return (await r.json()).filter(x => x.document).map(x => { const f = x.document.fields || {}; return { uid: x.document.name.split('/').pop(), nm: this.clean(f.name && f.name.stringValue) || '?', s: +(f.score && f.score.integerValue) || 0, lv: +(f.lv && f.lv.integerValue) || 0 }; });
  },
  /** 1-based rank of a score on a board (how many players are above it, plus one). */
  async rank(b, score) {
    const body = { structuredAggregationQuery: { structuredQuery: { from: [{ collectionId: 'scores' }], where: { fieldFilter: { field: { fieldPath: 'score' }, op: 'GREATER_THAN', value: { integerValue: String(score) } } } }, aggregations: [{ alias: 'n', count: {} }] } };
    const r = await fetch(this.url('boards/' + this.id(b)) + ':runAggregationQuery?key=' + CFG.online.apiKey, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('hs ' + r.status);

  best(b) { return b === 'endless' ? save.endlessBest : save.dailyCh.date === dayKey() ? save.dailyCh.best : 0; },
  /** End of an Endless / daily run: ask for a name the first time, send the score, then show the rank. */
  afterRun(r, delay) {
    if (!this.on() || !(r.score > 0)) return;
    const go = () => this.flush().then(() => this.showRank(r));
    if (!save.name) Timers.set(() => { if (SM.state === 'end' && Screens.end.r === r) this.askName(go); }, delay);
    else go();
  },
  /** After a level: show the current #1 of the Endless list on the High Scores button, to make the player want to try. */
  async tease(r) {
    if (!this.on() || !menuOn('lb')) return;
    let top = null; try { const v = this.view.endless; top = (v && v.rows && Date.now() - v.at < 60000 ? v.rows : await this.list('endless'))[0]; } catch (e) { return; }
    const el = $('#eHsSub'); if (!top || !el || SM.state !== 'end' || Screens.end.r !== r) return;
    el.textContent = top.uid === this.me() ? t('hsTop1') : t('hsBeat', top.nm, fmt(top.s));
  },
  async showRank(r) {
    const best = this.best(r.hs); if (!(best > 0) || !save.hs.sent[this.id(r.hs)]) return;
    let n = 0; try { n = await this.rank(r.hs, best); } catch (e) { return; }
    const el = $('#eRank'); if (el && SM.state === 'end' && Screens.end.r === r) el.textContent = t(r.hs === 'endless' ? 'hsRankE' : 'hsRankD', n);
  },
  askName(then) {
    Modal.open('<h3>🏆 ' + t('hsNameT') + '</h3><p class="note center-t">' + t('hsNameD') + '</p><input class="namein" id="hsNameIn" maxlength="12" autocomplete="nickname">'
      + '<p class="note center-t" id="hsErr" style="color:var(--c-bad);min-height:1.2em"></p><button class="btn pri block" data-a="hsName">' + t('hsSave') + '</button><button class="btn sm" data-a="mClose">' + t('hsLater') + '</button>');
    this.after = then; Timers.set(() => { const i = $('#hsNameIn'); if (i) i.focus(); }, 80);
  },
  /** Validate a typed name; returns it, or '' after showing why it was refused. */
  take(el, err) {
    const raw = el && el.value, v = this.clean(raw), why = !this.latin(raw) ? 'hsLatin' : !v ? 'hsEmpty' : this.bad(v) ? 'hsBad' : '';
    if (why) { if (err) err.textContent = t(why); if (el) el.focus(); this.why = why; return ''; }
    return v;
  },
  /** A new name in Settings also renames the player's entries on today's boards. */
  rename(el) {
    const v = this.take(el, null);
    if (!v) { el.value = save.name; UI.toast('✋', t(this.why || 'hsBad'), ''); return; }
    if (v === save.name) return;
    save.name = v; el.value = v;
    ['endless', 'daily'].forEach(b => { const x = this.best(b); if (x > 0) this.submit(b, x, b === 'endless' ? save.endlessLv || 0 : 0, true); });
    persist(true); this.flush();
  },
};

/** Daily login reward with a growing streak. */
const Daily = {
  canClaim() { return save.daily.last !== dayKey(); },
  nextStreak() { const y = new Date(); y.setDate(y.getDate() - 1); return save.daily.last === dayKey(y) ? save.daily.streak + 1 : 1; },
  reward(day) { const R = CFG.dailyRewards; return R[(day - 1) % R.length] * (Season.on('eid') ? 2 : 1); },

};

/** Auto quality: downgrade while playing if the frame rate stays low. */
/** Auto quality: steps down only after two slow 3-second windows in a row. A steady ~30 fps is a battery-saver
 *  screen cap (lower quality would not help), so it is left alone. */
const Perf = {
  frames: 0, t0: 0, fps: 60, warm: 0, bad: 0, capped: 0, last: 0,
  reset() { this.frames = 0; this.t0 = 0; this.warm = 0; this.bad = 0; this.capped = 0; this.last = 0; },
  sample(now, dt) {
    if ((this.warm += dt) < 3) return;          // the first seconds of a run build sprites
    if (!this.t0) { this.t0 = this.last = now; this.frames = this.capped = 0; return; }
    const d = now - this.last; this.last = now; this.frames++;
    if (d > 30 && d < 37) this.capped++;
    const el = now - this.t0;
    if (el < 3000) return;
    this.fps = Math.round(this.frames * 1000 / el);
    const cap = this.capped > this.frames * .8; this.t0 = now; this.frames = this.capped = 0;
    if (save.settings.quality !== 'auto' || document.hidden || cap || this.fps >= 45) { this.bad = 0; return; }
    if (++this.bad < 2) return;
    this.bad = 0;
    const order = ['high', 'medium', 'low'], i = order.indexOf(save.settings.autoQ);
    if (i >= 0 && i < 2) { save.settings.autoQ = order[i + 1]; persist(true); if (SM.inGameState()) this.pending = true; else applyQuality(); }
  },
};
function applyQuality() { Qcur = QUALITY[qualityKey()] || QUALITY.high; FX.init(Qcur.particles); layout(); }

/* ---------- pointer, FPS meter ---------- */
/** Last pointer state over the canvas (the mouse glove follows it). */
const Ptr = { x: 0, y: 0, mouse: false, down: false, over: false };
const Fps = { v: 60, acc: 0, n: 0, last: 0, worst: 0, w: 0, tick(now) { if (this.last) { const d = now - this.last; this.acc += d; this.n++; if (d > this.w) this.w = d; if (this.acc >= 500) { this.v = Math.round(this.n * 1000 / this.acc); this.worst = Math.round(this.w); this.acc = this.n = this.w = 0; } } this.last = now; } };

/* ---------- grabbing glove ---------- */
/** Cartoon glove sprite: open hand or fist, cuff in the target colour. Centre = palm. */
/* A hand that really grips: drawn in two layers around the stick (palm and sleeve behind it, fingers and thumb in front).
   Right hand coming from the right; mirrored in left-hand mode. close 0 = open, 1 = fist. Units are × u. */
const SKIN = { base: '#e7b28a', light: '#f6d3b5', shade: '#c88b62', dark: '#9c603d', nail: '#f7dfd2', sleeve: '#1f2937', sleeveHi: '#374151' };

  const K = SKIN;
  g.save(); g.translate(x, y); g.scale(flip * u, u);
  g.fillStyle = 'rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(16, 20, 18, 7, -.5, 0, 7); g.fill();            // soft shadow
  let gr = g.createLinearGradient(18, 14, 34, 50); gr.addColorStop(0, K.sleeveHi); gr.addColorStop(.6, K.sleeve); gr.addColorStop(1, 'rgba(31,41,55,0)');   // sleeve, fading out
  g.fillStyle = gr; g.beginPath(); g.moveTo(10, 18); g.lineTo(28, 12); g.lineTo(38, 50); g.lineTo(18, 54); g.closePath(); g.fill();
  g.fillStyle = cuff; g.beginPath(); g.moveTo(9.5, 16); g.lineTo(28, 10); g.lineTo(29.5, 15); g.lineTo(11, 21.5); g.closePath(); g.fill();   // cuff in the target colour
  gr = g.createLinearGradient(6, -6, 26, 16); gr.addColorStop(0, K.light); gr.addColorStop(.55, K.base); gr.addColorStop(1, K.shade);
  g.fillStyle = gr; g.beginPath();                                                                          // back of the hand + wrist
  g.moveTo(3, -12); g.bezierCurveTo(14, -16, 24, -12, 25, -2); g.bezierCurveTo(27, 6, 24, 12, 26, 13);
  g.lineTo(11, 18); g.bezierCurveTo(8, 12, 3, 8, 2, 2); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(156,96,61,.35)'; g.lineWidth = .8; g.beginPath();                                   // tendons
  for (const [a, b] of [[[10, -8], [18, 6]], [[13, -9], [21, 4]], [[16, -8], [23, 2]]]) { g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); }

}

      const m = pool.splice(r() * pool.length | 0, 1)[0];
      list.push({ id: m.id, goal: m.goals[tier], rw: m.rw + tier * 10, c: m.id === 'color' ? COLOR_KEYS[r() * (u >= CFG.unlock.colors3 ? 3 : 2) | 0] : '', p: 0, done: false, got: false });
    }
    save.missions = { date: today, list, bonus: false }; persist(true);
    return save.missions;
  },
  def(id) { return MISSIONS.find(m => m.id === id) || MISSIONS[0]; },
  text(m) { return t('m_' + m.id, fmt(m.goal), m.c ? t('cs_' + m.c) : ''); },
  /** Add a finished (r) or abandoned (r = null) run; returns the missions it completed. */
  track(G, r) {
    const M = this.ensure(), out = [];
    for (const m of M.list) {
      if (m.done) continue;
      switch (m.id) {
        case 'catch': m.p += G.hits; break;
        case 'color': m.p += G.colorHits[m.c] || 0; break;
        case 'combo': m.p = Math.max(m.p, G.maxCombo); break;
        case 'wins': if (r && r.win && (r.mode === 'level' || r.mode === 'daily')) m.p++; break;
        case 'stars': if (r && r.stars === 3) m.p++; break;
        case 'quick': m.p += G.quickN; break;
        case 'endless': if (G.mode === 'endless') m.p = Math.max(m.p, G.score); break;
        case 'gold': m.p += G.goldN; break;
        case 'power': m.p += G.powerN; break;
      }
      if (m.p >= m.goal) { m.p = m.goal; m.done = true; out.push(m); }
    }

  },
  claimable() { const M = this.ensure(); let n = 0; for (const m of M.list) if (m.done && !m.got) n++; if (!M.bonus && M.list.every(m => m.got)) n++; return n; },
  toast(list, delay) { const g0 = toastGen; list.forEach((m, i) => setTimeout(() => { if (g0 !== toastGen) return; UI.toast(this.def(m.id).ico, t('missionDone'), this.text(m)); Sound.play('mission'); }, (delay || 0) + i * 1300)); },
};

/* ---------- save history: automatic backups + a progress log ---------- */
const BACKUP_KEY = 'fs_backups';
const History = {
  off: false,                                    // true while a developer test run is recorded
  ICO: { win: '⭐', boss: '👑', world: '🌆', ach: '🏆', best: '📈', buy: '🛍️', daily: '📅', restore: '↩️', import: '📥', reset: '🔄', plv: '🆙', stk: '🏷️', ev: '🏮' },
  /** Add a progress-log entry; its text is built when shown, so it follows the current language. */
  log(k, a) { if (this.off) return; save.log.unshift({ t: Date.now(), k, a: a || [] }); if (save.log.length > CFG.history.log) save.log.length = CFG.history.log; },
  backups() { try { const b = JSON.parse(Store.get(BACKUP_KEY)); return Array.isArray(b) ? b : []; } catch (e) { return []; } },
  /** Snapshot the save (why: auto | manual | import | reset | restore). Its own storage key, so it survives a reset. */
  backup(why) {
    if (this.off) return;
    const list = this.backups();
    list.unshift({ t: Date.now(), why, n: unlockedLevel(), st: totalStars(save), c: save.coins, d: JSON.stringify(save) });
    if (list.length > CFG.history.backups) list.length = CFG.history.backups;
    while (list.length && !Store.set(BACKUP_KEY, JSON.stringify(list))) list.pop();   // storage full → drop the oldest
  },
  /** Automatic backup at most every CFG.history.autoMin minutes (forced after milestones such as a boss). */
  autoBackup(force) { const b = this.backups()[0]; if (force || !b || Date.now() - b.t > CFG.history.autoMin * 60000) this.backup('auto'); },
  /** Restore backup i (current progress is backed up first; settings stay as they are). */
  restore(i) {
    const e = this.backups()[i]; if (!e) return false;
    let d; try { d = JSON.parse(e.d); } catch (err) { return false; }
    this.backup('restore');
    const keep = save.settings; save = migrate(d); save.settings = keep;
    this.log('restore'); persist();
    return true;
  },
  /** "just now" / "5 minutes ago" / a short date, in the current language. */
  when(ts) {
    const loc = LANG === 'ar' ? 'ar-u-nu-latn' : LANG, sec = Math.round((ts - Date.now()) / 1000);
    if (sec > -45) return t('justNow');
    try {
      const rt = new Intl.RelativeTimeFormat(loc, { numeric: 'auto' });
      if (sec > -3600) return rt.format(Math.round(sec / 60), 'minute');
      if (sec > -86400) return rt.format(Math.round(sec / 3600), 'hour');
      return new Date(ts).toLocaleString(loc, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    } catch (e) { return new Date(ts).toLocaleString(); }
  },
  text(e) {
    const a = e.a;
    switch (e.k) {
      case 'win': return t('lg_win', a[0], '★'.repeat(a[1] || 0));
      case 'boss': return t('lg_boss', worldName(a[0]));
      case 'world': return t('lg_world', worldName(a[0]));
      case 'ach': { const x = ACH.find(q => q.id === a[0]); return t('lg_ach', x ? Ach.name(x) : a[0]); }
      case 'best': return t('lg_best', a[0] === 'endless' ? t('mEndless') : t('mDaily'), fmt(a[1]));
      case 'buy': return t('lg_buy', itemName(a[0], a[1]));
      case 'plv': return t('lg_plv', a[0]);
      case 'stk': return t('lg_stk', t('stk_' + a[1]), worldName(a[0]));
      case 'ev': return t('lg_ev', a[0]);
      default: return t('lg_' + e.k);
    }
  },
};
